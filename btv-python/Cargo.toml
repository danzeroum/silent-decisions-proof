[package]
name = "btv-python"
version = "0.2.0"
edition = "2021"
description = "Python bindings for btv-core (PyO3)"
license = "MIT"
repository = "https://github.com/danzeroum/silent-decisions-proof"

[lib]
name = "btv_python"
crate-type = ["cdylib", "rlib"]

[features]
default = []
test-support = ["btv-core/test-support"]

[dependencies]
btv-core = { path = "../btv-core" }
# pyo3 0.29: upgraded from 0.22 to clear RUSTSEC-2025-0020
# (PyString::from_object buffer overflow, fixed >=0.24.1) and
# RUSTSEC-2026-0177 (missing Sync bound on PyCFunction::new_closure,
# fixed >=0.29.0). The workspace unification (root Cargo.lock) exposed
# these advisories to the strict `cargo audit --deny warnings` CI step,
# which previously only scanned btv-core's isolated lockfile. Neither
# affected API is called by this crate, but the strict audit posture is
# part of the paper's security narrative (Section 4.4).
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
