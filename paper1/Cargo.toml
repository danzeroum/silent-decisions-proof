[package]
name = "silent-decisions-proof"
version = "0.1.0"
edition = "2021"
description = "Machine-checkable proof for the Constitutional Enclosure Theorem"
repository = "https://github.com/danzeroum/silent-decisions-proof"
license = "MIT"

[[bin]]
name = "silent-decisions-proof"
path = "src/main.rs"

[features]
test-support = []

[dependencies]
# OS-09: btv-core is the canonical implementation; this crate re-exports it.
btv-core = { path = "../btv-core" }

[dev-dependencies]
# Example-only direct use (emergency_escalation hashes/encodes operator ids).
blake3 = "1"
hex = "0.4"
