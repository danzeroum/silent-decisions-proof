name: CI — btv-core + btv-python (artifact-v2)

on:
  push:
    branches: [artifact-v2, main]
  pull_request:
    branches: [artifact-v2, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt-clippy-audit:
    name: Format + Clippy + Audit (x86-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: 'Install Rust toolchain (pinned; single source: rust-toolchain.toml, OS-09)'
        # A prior revision of this step removed `components:` here on the
        # theory that it raced with rust-toolchain.toml's own declaration.
        # That misdiagnosed the failure: this job (and its single-process
        # `cargo fmt --check` / `cargo clippy` first-use) has been reliable
        # in every observed run, explicit components or not. The actual
        # race is in the `test-x86-64` job's toolchain step (see its
        # comment) — a multi-crate parallel `cargo test` racing rustup's
        # implicit component auto-install against itself. Restored here
        # for consistency with that job's now-explicit installs, not
        # because this job ever exhibited the race.
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked || true

      - name: cargo fmt --check
        working-directory: btv-core
        run: cargo fmt --check

      - name: cargo clippy (pedantic)
        working-directory: btv-core
        run: cargo clippy --all-targets --features test-support -- -D clippy::pedantic

      - name: cargo audit (workspace root Cargo.lock)
        # The unified workspace keeps a single Cargo.lock at the repository
        # root; the per-crate lockfiles were removed, and cargo audit does
        # NOT walk up from a member directory to find the workspace lock —
        # running it from btv-core/ now fails with "Couldn't load
        # Cargo.lock". One audit from the root covers every member
        # (btv-core, btv-python, paper1, paper2 — 232 dependencies in the
        # unified lock, including the pyo3 and rayon trees).
        run: cargo audit --deny warnings

      - name: Verify reports reconcile with raw evidence (OS-05)
        # Re-derives every number in reports/tcb_summary.md from the
        # committed raw artifacts (geiger CSV, audit JSON, clippy raw,
        # Cargo.lock) and fails on ANY divergence.
        run: python3 scripts/verify_reports.py

  test-x86-64:
    name: Test (x86-64)
    runs-on: ubuntu-latest
    needs: fmt-clippy-audit
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        # Explicit components, not just the rust-toolchain.toml declaration:
        # this job's first cargo invocation below is a multi-target `cargo
        # test` that compiles several crates in parallel, and letting
        # rust-toolchain.toml's implicit "install missing components on
        # first use" path handle it let concurrent rustc processes each
        # independently race to add rustfmt to the same toolchain, hitting
        # rustup's 'detected conflict: bin/cargo-fmt' bug (intermittent —
        # this job failed on this exact error at 86a8f67, again at 591bcae,
        # and again at 5db1869, on three unrelated code states, which rules
        # out the code and points at this race). An explicit, sequential
        # install here — before any cargo command runs — finishes the
        # transaction once, so nothing later finds components missing.
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install maturin and Python deps
        run: |
          pip install --upgrade pip
          pip install maturin pytest opentelemetry-sdk opentelemetry-api pyyaml numpy

      - name: Run Rust unit + integration tests
        working-directory: btv-core
        # test_status_quo_contrast (Round 3, Task B1): the fail-open vs.
        # fail-secure contrast experiment behind the E2 status-quo baseline —
        # the status quo issues decisions while records vanish; BTV's
        # Verdict exists only through consumed linear tokens.
        #
        # test_append_only (OS-03, closes F3) and test_proof_clauses
        # (OS-09, closes H4/H6 — 11 of the 17 numbered proof clauses) were
        # previously never named here: `cargo test` restricts execution to
        # exactly the targets an explicit `--test` names, so both files
        # silently never ran in CI despite the manuscript's "seventeen
        # clauses, cargo test, seconds" claim (Sections 1 and 7) and the
        # F3 fix depending on this exact suite for its regression gate.
        run: cargo test --features test-support --lib --test test_partition --test test_load --test test_status_quo_contrast --test test_append_only --test test_proof_clauses

      - name: Run trybuild compile-fail tests
        working-directory: btv-core
        run: cargo test --features test-support --test trybuild

      - name: Run Rust benchmarks (criterion, quick)
        working-directory: btv-core
        # No `|| true`: masking bench failures hid regressions (audit, Parte
        # C/D). The durable bench (OS-07) opens a real file — still fast
        # enough for --quick on CI.
        run: cargo bench --features test-support --bench verdict_construction -- --quick

      - name: Build PyO3 binding
        working-directory: btv-python
        run: maturin build --release --features test-support

      - name: Install PyO3 binding
        # The unified Cargo workspace (PR #4) moved the shared target/ dir to
        # the repository ROOT: maturin now writes the wheel to
        # <root>/target/wheels/*.whl, not btv-python/target/wheels. Run this
        # step from the workspace root or the glob stays unexpanded and pip
        # receives the literal '*' ("Invalid wheel filename").
        run: pip install --force-reinstall target/wheels/*.whl

      - name: Run Python binding tests
        run: pytest tests/pyo3/test_binding.py -v

  test-arm64-qemu:
    name: Test (ARM64 via QEMU)
    runs-on: ubuntu-latest
    needs: fmt-clippy-audit
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain with aarch64 target
        # The pin in rust-toolchain.toml (OS-09) means cargo resolves 1.98.1
        # INSIDE this repository; the aarch64 std must therefore be added to
        # THAT toolchain, not to a floating stable channel. Components are
        # also explicit here (see test-x86-64's toolchain step for why):
        # this job's first cargo command is likewise a multi-crate parallel
        # build, the same shape that hit the rustup 'bin/cargo-fmt' install
        # race in that job.
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-unknown-linux-gnu
          components: rustfmt, clippy

      - name: Install QEMU and cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-user-static \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            libgcc-14-dev-arm64-cross

      - name: Configure cargo for cross-compilation
        working-directory: btv-core
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          runner = "qemu-aarch64-static -L /usr/aarch64-linux-gnu"
          EOF

      - name: Cross-compile btv-core to ARM64
        working-directory: btv-core
        run: cargo build --target aarch64-unknown-linux-gnu --features test-support

      - name: Run ARM64 unit tests via QEMU
        working-directory: btv-core
        run: cargo test --target aarch64-unknown-linux-gnu --features test-support --lib

      - name: Run ARM64 partition tests via QEMU
        working-directory: btv-core
        run: cargo test --target aarch64-unknown-linux-gnu --features test-support --test test_partition

      - name: Run ARM64 load test via QEMU
        working-directory: btv-core
        env:
          BTV_UNDER_QEMU: "1"
          BTV_TEST_THREADS: "2"
        run: cargo test --target aarch64-unknown-linux-gnu --features test-support --test test_load -- --nocapture

  manuscript-build:
    name: Manuscript compiles (LaTeX gate)
    runs-on: ubuntu-latest
    # COMSI-2026-04-0112 Round 3: until this round the manuscript had never
    # been compiled in any round — every check was structural. The first
    # compile found three tables overflowing IEEEtran's column measure by up
    # to 99.7 pt, which no structural check can see. The compile is a gate now.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TeX Live (IEEEtran + cmll + listings)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexdiff texlive-extra-utils lmodern pandoc zip unzip \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-publishers texlive-fonts-recommended texlive-fonts-extra \
            texlive-science

      - name: Compile and enforce typographic gates
        run: |
          python3 scripts/count_words.py
          bash scripts/build_manuscript.sh

      - name: Compile concise response letter
        run: bash scripts/build_response_letter.sh

      - name: Build tracked changes and LaTeX upload package
        run: |
          bash scripts/build_tracked_changes.sh
          bash scripts/build_submission_package.sh

      - name: Upload submission files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: submission-files
          path: |
            release/COMSI-2026-04-0112_main_final.pdf
            release/COMSI-2026-04-0112_source.zip
            release/COMSI-2026-04-0112_main_tracked_changes.pdf
            release/COMSI-2026-04-0112_response_letter_final.pdf

  tco-reproducibility:
    name: TCO Reproducibility
    runs-on: ubuntu-latest
    needs: fmt-clippy-audit
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml numpy

      - name: Recompute N* (derived from primitives)
        run: python3 scripts/compute_crossover.py

      - name: Internal-consistency gate (OS-04)
        # The gate asserts that rho and N* RE-DERIVE from the published
        # primitives — it never asserts a particular N* value (that was the
        # F4 defect: the old job verified the conclusion, 500k±10k, and
        # would have failed if rho were corrected).
        run: |
          python3 - <<'EOF'
          import csv, sys
          import yaml
          params = yaml.safe_load(open('data/policy_parameters.yaml'))
          c_fixed = params['c_fixed_usd_per_year']
          c_var = params['c_variable_usd_per_decision']
          rows = list(csv.DictReader(open('data/n_star_by_regime.csv')))
          assert rows, 'n_star_by_regime.csv is empty'
          for r in rows:
              p = params['regimes'][r['regime']]
              rho_expected = (p['enforcement_prob_per_year']
                              * p['expected_fine_usd']
                              / p['avg_controller_decisions_per_year'])
              rho_used = float(r['rho_derived_usd_per_decision'])
              assert abs(rho_used - rho_expected) <= 1e-12 * max(rho_expected, 1.0), \
                  f"{r['regime']}: rho used {rho_used} != derived {rho_expected}"
              n_full = r['n_star_full_avoidance']
              if n_full:
                  expect = c_fixed / (rho_used - c_var)
                  assert abs(float(n_full) - expect) <= 1e-6 * expect, \
                      f"{r['regime']}: N* full {n_full} != C/(rho-c_var) = {expect}"
              print(f"OK: {r['regime']} rho={rho_used:.6f} (derived) N*_full={n_full or 'no crossover'}")
          print('Internal consistency: all regimes re-derive from primitives.')
          EOF

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tco-reports
          path: |
            reports/tco_summary.md
            data/n_star_by_regime.csv
            data/tco_plot_data.csv
            appendix_b_pgfplots.tex
